<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ghost.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Cloud Trek — Build with Kiro. Deploy on AWS.</title>
    <meta
      name="description"
      content="AWS Cloud Trek — a hands-on student event. Build with Kiro, deploy on AWS. Beginner friendly."
    />
    <meta property="og:title" content="AWS Cloud Trek" />
    <meta
      property="og:description"
      content="Build with Kiro. Deploy on AWS. A hands-on student journey from idea to cloud."
    />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- n8n Chat Widget CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

    <style>
      /* 1. Kiro Theme Variables (dark IDE-panel palette, brand purple accent) */
      :root {
        --kiro-purple: #9046FF;
        --kiro-purple-hover: #7C36DB;
        --kiro-purple-active: #6425B8;
        --kiro-bg: #0D0B10;
        --kiro-surface: #19161D;
        --kiro-surface-elevated: #211D25;
        --kiro-border: #2A262E;
        --kiro-text: #FAFAFA;
        --kiro-text-muted: #A1A1AA;

        --chat--color-primary: var(--kiro-purple) !important;
        --chat--color-primary-shade-50: var(--kiro-purple-hover) !important;
        --chat--color-primary-shade-100: var(--kiro-purple-active) !important;
        --chat--toggle--background: var(--kiro-purple) !important;
        --chat--toggle--hover--background: var(--kiro-purple-hover) !important;
        --chat--toggle--active--background: var(--kiro-purple-active) !important;
        --chat--toggle--color: #FFFFFF !important;
        --chat--color-font: var(--kiro-text) !important;

        --chat--header--background: var(--kiro-bg) !important;
        --chat--header--color: var(--kiro-text) !important;
        --chat--header--border-bottom: 2px solid var(--kiro-purple) !important;

        --chat--body--background: var(--kiro-bg) !important;
        --chat--message--bot--background: var(--kiro-surface) !important;
        --chat--message--bot--color: var(--kiro-text) !important;
        --chat--message--user--background: var(--kiro-purple) !important;
        --chat--message--user--color: #FFFFFF !important;

        --chat--input--background: var(--kiro-surface-elevated) !important;
        --chat--input--text-color: var(--kiro-text) !important;
        --chat--input--container--background: var(--kiro-surface-elevated) !important;
        --chat--input--container--border: 1px solid var(--kiro-border) !important;
        --chat--input--container--padding: 6px 6px 6px 16px !important;
        --chat--footer--background: var(--kiro-bg) !important;
        --chat--footer--border-top: 1px solid var(--kiro-border) !important;

        --chat--window--border: none !important;
        --chat--border-radius: 12px !important;
      }

      /* 2. Cursor fixes */
      .chat-window, .chat-window *, .chat-toggle, .chat-toggle * {
        cursor: auto !important;
      }
      .chat-window button, .chat-window [role="button"], .chat-toggle {
        cursor: pointer !important;
      }
      .chat-window input, .chat-window textarea {
        cursor: text !important;
      }

      /* 3. Kiro-style docked sidebar (desktop) / bottom sheet (mobile) */
      .chat-window {
        background-color: var(--kiro-bg) !important;
        overflow: hidden !important;
      }

      /* Input pill: subtle border that lights up purple on focus, plus a
         proper filled circular send button instead of a bare arrow. */
      .chat-inputs {
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .chat-inputs:focus-within {
        border-color: var(--kiro-purple) !important;
        box-shadow: 0 0 0 3px rgba(144, 70, 255, 0.25) !important;
      }
      .chat-inputs textarea::placeholder {
        color: var(--kiro-text-muted) !important;
      }

      .chat-input-send-button {
        width: 34px !important;
        height: 34px !important;
        flex-shrink: 0;
        background-color: var(--kiro-purple) !important;
        color: #FFFFFF !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        transition: background-color 0.15s ease, transform 0.1s ease !important;
      }
      .chat-input-send-button:hover {
        background-color: var(--kiro-purple-hover) !important;
        color: #FFFFFF !important;
        transform: scale(1.06);
      }
      .chat-input-send-button:active {
        transform: scale(0.94);
      }
      .chat-input-send-button svg {
        width: 16px !important;
        height: 16px !important;
      }

      .kiro-trademark {
        flex-shrink: 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--kiro-text-muted);
        background-color: var(--kiro-bg);
        border-top: 1px solid var(--kiro-border);
        padding: 8px 12px;
      }
      .kiro-trademark span {
        color: var(--kiro-purple);
        font-weight: 600;
      }

      /* Kiro ghost mark overlaid onto the chat header (the embed has no logo slot) */
      .chat-heading {
        align-items: center !important;
        gap: 12px !important;
      }
      .chat-heading h1 {
        font-size: 1.2rem !important;
        line-height: 1.2 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }
      .chat-header p {
        display: none !important;
      }
      .kiro-chat-logo {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border-radius: 50%;
        background-color: var(--kiro-purple);
        border: 2px solid #0B0A0F;
        padding: 8px;
        box-sizing: border-box;
        display: block;
      }

      @media (max-width: 640px) {
        .chat-window {
          width: calc(100vw - 2.5rem) !important;
          max-width: 320px !important;
          height: 70vh !important;
          max-height: 560px !important;
          bottom: 5.25rem !important;
          right: 1.25rem !important;
          border: 3px solid var(--kiro-purple) !important;
          border-radius: 16px !important;
          box-shadow: 6px 6px 0px 0px #0B0A0F !important;
        }
        /* Everything inside feels cramped at full desktop scale on a small
           card, so shrink the header a touch too. */
        .kiro-chat-logo {
          width: 34px !important;
          height: 34px !important;
          padding: 6px !important;
        }
        .chat-heading {
          gap: 8px !important;
        }
        .chat-heading h1 {
          font-size: 1rem !important;
        }
      }

      @media (min-width: 641px) {
        /* .chat-window-toggle lives inside .chat-window-wrapper too, so
           resizing the wrapper itself drags the toggle button along with
           it. Instead take .chat-window out of the wrapper's flex flow
           with its own position:fixed, floating card with a small margin
           on every side (matching the mobile look) and just enough
           bottom clearance for the launcher badge to sit close beneath it. */
        .chat-window {
          position: fixed !important;
          top: 1.5rem !important;
          right: 1.5rem !important;
          bottom: 7.5rem !important;
          left: auto !important;
          width: 400px !important;
          max-width: 400px !important;
          /* n8n hardcodes height:600px (not "auto"), so top+bottom alone
             won't size the box — it has to be computed explicitly. */
          height: calc(100vh - 1.5rem - 7.5rem) !important;
          max-height: calc(100vh - 1.5rem - 7.5rem) !important;
          border: 3px solid var(--kiro-purple) !important;
          border-radius: 20px !important;
          box-shadow: 8px 8px 0px 0px #0B0A0F !important;
          z-index: 9999 !important;
        }
      }

      /* 4. Kill the pink rim on all n8n toggle wrappers & native buttons */
      .chat-toggle,
      button[class*="toggle"],
      button[aria-label*="chat" i],
      div[class*="toggle"],
      div[class*="chat-toggle"] {
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }

      /* Keep the real native button invisible so our visual button handles the look */
      .chat-toggle,
      button[class*="toggle"],
      button[aria-label*="chat" i] {
        opacity: 0.001 !important;
        z-index: 2147483647 !important;
      }

      /* 5. Pure Neo-Brutalist Purple Ghost Launcher */
      #ghost-visual-badge {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 68px;
        height: 68px;
        border-radius: 9999px;
        background-color: var(--kiro-purple, #9046FF);
        border: 3px solid #0B0A0F;
        box-shadow: 4px 4px 0px 0px #0B0A0F;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none; /* Let user clicks pass through to n8n's transparent button */
        z-index: 2147483646;
        transition: box-shadow 0.15s ease;
        animation: kiro-float 2.6s ease-in-out infinite;
      }

      /* Gentle bob, like a buoy on water, to draw the eye to the launcher.
         Paused once the chat is open — it's a close button then, not a toy. */
      @keyframes kiro-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      #ghost-visual-badge.is-open {
        animation: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #ghost-visual-badge {
          animation: none;
        }
      }

      #ghost-visual-badge img {
        width: 40px;
        height: 40px;
        object-fit: contain;
        display: block;
      }

      #ghost-visual-badge .badge-close {
        display: none;
        font-size: 28px;
        font-weight: 900;
        color: #FFFFFF;
        line-height: 1;
      }

      /* Only show ✕ when chat is actively open */
      #ghost-visual-badge.is-open img {
        display: none;
      }
      #ghost-visual-badge.is-open .badge-close {
        display: block;
      }

      @media (max-width: 640px) {
        #ghost-visual-badge {
          bottom: 16px;
          right: 16px;
          width: 52px;
          height: 52px;
        }
        #ghost-visual-badge img {
          width: 28px;
          height: 28px;
        }
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Custom Purple Ghost Badge -->
    <div id="ghost-visual-badge" aria-hidden="true">
      <img src="/ghost.svg" alt="Chat Assistant" />
      <span class="badge-close">✕</span>
    </div>

    <!-- n8n Chat Initialization Script -->
    <script type="module">
      import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

      createChat({
        webhookUrl: 'https://akshay145.app.n8n.cloud/webhook/a73e7828-60dd-412e-9f53-7282c3e33b63/chat',
        showWelcomeScreen: false,
        theme: {
          button: {
            backgroundColor: '#9046FF',
            color: '#FFFFFF',
          },
        },
        initialMessages: [
          'Welcome to AWS Cloud Trek 2026! 🚀',
          'Ask me anything about the workshop schedule, venue, prerequisites, or registration.'
        ],
        i18n: {
          en: {
            title: 'AWS Cloud Trek Assistant',
            subtitle: '',
            inputPlaceholder: 'Ask a question...',
          },
        },
      });

      // The n8n embed has no logo slot, so overlay our own Kiro ghost mark
      // onto the header, and pin the "Built by AWS SBG" trademark to the
      // bottom of the sidebar.
      const brandingObserver = new MutationObserver(() => {
        const chatLayoutEl = document.querySelector('.chat-window .chat-layout');
        if (chatLayoutEl && !chatLayoutEl.querySelector('.kiro-trademark')) {
          const trademark = document.createElement('div');
          trademark.className = 'kiro-trademark';
          trademark.innerHTML = 'Built by <span>AWS SBG</span>';
          chatLayoutEl.appendChild(trademark);
        }

        const chatHeading = document.querySelector('.chat-heading');
        if (chatHeading && !chatHeading.querySelector('.kiro-chat-logo')) {
          const logo = document.createElement('img');
          logo.src = '/ghost.svg';
          logo.alt = 'Kiro';
          logo.className = 'kiro-chat-logo';
          chatHeading.insertBefore(logo, chatHeading.firstChild);
        }
      });
      brandingObserver.observe(document.body, { childList: true, subtree: true });

      const badge = document.getElementById('ghost-visual-badge');

      // Accurate check: Only show '✕' if the chat window is genuinely open and visible
      function syncBadgeState() {
        const chatWin = document.querySelector('.chat-window');
        if (!chatWin) {
          badge.classList.remove('is-open');
          return;
        }

        const rect = chatWin.getBoundingClientRect();
        const isVisible = rect.height > 100 && 
                          chatWin.style.display !== 'none' && 
                          !chatWin.classList.contains('hidden') && 
                          getComputedStyle(chatWin).visibility !== 'hidden' &&
                          getComputedStyle(chatWin).opacity !== '0';

        if (isVisible) {
          badge.classList.add('is-open');
        } else {
          badge.classList.remove('is-open');
        }
      }

      setInterval(syncBadgeState, 200);
    </script>
  </body>
</html>
